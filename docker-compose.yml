services:
  # ── DeepEye 知识拓扑与深度调研服务 ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepeye-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # 容器内网络直连 SearXNG 服务
      - SEARXNG_URL=http://searxng:8080
      # 若需配置 LLM 模型能力，请在 .env.local 或此处填入
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
    volumes:
      # 持久化调研会话数据与本地登录态
      - ./data:/app/data
    depends_on:
      - searxng
    restart: unless-stopped

  # ── SearXNG 多引擎聚合搜索服务 ──
  searxng:
    image: searxng/searxng:latest
    container_name: deepeye-searxng
    ports:
      # 宿主机 8888 -> 容器 8080（避开常见的 8080 占用）
      - "8888:8080"
    volumes:
      # 挂载配置目录：settings.yml 里的 search.formats 必须含 json，
      # 否则 /search?format=json 一律返回 403，整个搜索层不可用。
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    restart: unless-stopped
